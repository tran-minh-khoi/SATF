# Biên dịch bản Mac và chạy scripts/test-mac.sh (thao tác Edit + tự cập nhật) trên máy Mac của GitHub.
name: macOS tests

on:
  workflow_dispatch:
  pull_request:
    paths: [Sources/**, tests/EditTests.swift, scripts/test-mac.sh, scripts/promo*.swift, .github/workflows/mac-tests.yml]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: xcrun swiftc -O -swift-version 5 -sdk "$(xcrun --sdk macosx --show-sdk-path)" -target arm64-apple-macos13.0 Sources/*.swift -o "$RUNNER_TEMP/SATF"
      - name: Run tests
        run: ./scripts/test-mac.sh
      # scripts/promo.sh dựng video giới thiệu từ chính code của app: kiểm tra vẫn biên dịch được
      - name: Build the promo video scripts
        run: |
          for kind in promo promo-youtube; do
            mkdir -p "$RUNNER_TEMP/$kind" && cp "scripts/$kind.swift" "$RUNNER_TEMP/$kind/main.swift"
            xcrun swiftc -O -suppress-warnings -sdk "$(xcrun --sdk macosx --show-sdk-path)" $(ls Sources/*.swift | grep -v main.swift) "$RUNNER_TEMP/$kind/main.swift" -o "$RUNNER_TEMP/$kind/promo"
          done
